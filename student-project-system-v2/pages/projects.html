<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPMS · Projects</title>
  <link rel="stylesheet" href="../css/style.css?v=bookman-old-style-1">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../index.html">SPMS</a>
    <nav aria-label="Primary">
      <a href="../index.html">Home</a>
      <a href="about.html">About</a>
      <a href="projects.html">Projects</a>
      <a href="register.html">Register</a>
    </nav>
  </header>

  <main class="container">
    <p class="eyebrow">Portfolio</p>
    <h1>Projects</h1>

    <div class="toolbar">
      <input id="project-search" type="search" placeholder="Search projects…" aria-label="Search projects">
      <select id="status-filter" aria-label="Filter by status">
        <option value="">All statuses</option>
        <option>Proposed</option>
        <option>In progress</option>
        <option>Completed</option>
        <option>Archived</option>
      </select>
      <p class="count">Showing <strong id="project-count">0</strong> project(s)</p>
    </div>

    <section id="project-grid" class="card-grid">
      <article class="card project-card" data-status="In progress">
        <span class="eyebrow">In progress</span>
        <h2>Student attendance dashboard</h2>
        <p>Track attendance and identify support needs.</p>
      </article>
      <article class="card project-card" data-status="Proposed">
        <span class="eyebrow">Proposed</span>
        <h2>Small business sales insights</h2>
        <p>Turn monthly sales records into useful charts.</p>
      </article>
    </section>
  </main>

  <script src="../js/app.js" defer></script>
</body>
</html>
